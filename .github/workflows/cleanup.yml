name: cleanup

on:
  schedule:
    # 매일 03:17 (한국 시간). GitHub의 cron은 UTC다.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install .
      # 만료된 방과 30일 넘은 콘텐츠 캐시를 지운다. 이 접속이 Supabase 무료 플랜의 일주일 무활동 정지도 막는다.
      - run: python -m scripts.cleanup_expired
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # 경기, 인천 공연의 공연장 좌표를 미리 캐시에 채운다.
  # 정리 작업이 같은 캐시 행을 지우는 중에 겹치지 않게 그 뒤에 돌고, 정리가 실패해도 돈다.
  warm-venues:
    needs: cleanup
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install .
      - run: python -m scripts.warm_kopis_venues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
